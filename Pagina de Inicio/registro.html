<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro - SISBAR</title>

    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/CSS/pagina de inicio/regristro.css">
</head>
<body>

    <div class="contenedor-login">

        <div class="regresar-inicio">
            <a href="/Pagina de Inicio/index.html">VOLVER AL INICIO</a>
        </div>

        <div class="logo-sisbar">

                <img src="/IMAGES/logo-sisbar.png" alt="Logo SISBAR">

                <h2>SISBAR
                    <span>"Estilo y Cuidado"</span>
                </h2>

                <h2 class="h2-bienvenido">Crear Cuenta</h2>
                <p>Regístrate para acceder a tu cuenta</p>
        </div>

        <form class="login-form" action="registro" method="post">

            <!-- PRIMER BLOQUE (Nombres y Apellidos) -->
            <div class="primer-bloque">
                <div class="input-group">
                    <label for="nombres">Nombres</label>
                    <input type="text" id="nombres" name="nombres" placeholder="Osmar Daniel" required>
                </div>

                <div class="input-group">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" placeholder="Ortiz Miranda" required>
                </div>
            </div>

            <!-- SEGUNDO BLOQUE (Identidad y Celular) -->
            <div class="segundo-bloque">
                <div class="input-group">
                    <label for="numero-identidad">Número de Identidad</label>
                    <input type="number" id="numero-identidad" name="numero-identidad" placeholder="1.234.567.801" required>
                </div>

                <div class="input-group">
                    <label for="numero-cel">Número de Celular</label>
                    <input type="number" id="numero-cel" name="numero-cel" placeholder="300-123-4567" required>
                </div>
            </div>

            <!-- TERCER BLOQUE (Campos de ancho completo 100%) -->
            <div class="input-group-full">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="carlos@ejemplo.com" required>
            </div>

            <div class="input-group-full">
                <label for="fecha-nacimiento">Fecha de Nacimiento</label>
                <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" required>
            </div>

            <div class="input-group-full">
                <label for="nacionalidad">Nacionalidad</label>
                <input type="text" id="nacionalidad" name="nacionalidad" placeholder="Colombiana" required>
            </div>

            <div class="input-group-full contenedor-password">
                <label for="password">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
                    <i class="material-icons unsee-icon">visibility</i>
                </div>
            </div>

            <div class="input-group-full contenedor-password">
                <label for="confirm-password">Confirmar Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Repite tu contraseña" required>
                    <i class="material-icons unsee-icon">visibility</i>
                </div>
            </div>

            <!-- TERMINOS Y CONDICIONES -->
            <div class="terminos-condiciones">
                <label>
                    <input type="checkbox" required />
                    <span>Acepto los <a href="#">Términos y Condiciones</a> y la <a href="#">Política de Privacidad</a> de SISBAR.</span>
                </label>
            </div>

            <!-- BOTÓN DE REGISTRO -->
            <button type="submit" class="btn-registrar">
                <i class="material-icons">person_add</i> REGISTRARSE
            </button>

            <div class="iniciar-sesion-link">
                ¿Ya tienes cuenta? <a href="/Pagina de Inicio/iniciar-sesion.html">Inicia sesión</a>
            </div>
        </f>
    </div>

    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
