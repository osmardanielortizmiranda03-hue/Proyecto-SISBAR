# =====================================================================
#  SISBAR - Configuración del módulo de Citas (Spring Boot)
# =====================================================================

# Nombre de la aplicación y puerto (8081 para no chocar con el módulo JSP en 8080)
spring.application.name=sisbar-citas
server.port=8081
server.servlet.context-path=/sisbar-citas

# ---------- Base de datos MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/sisbar?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=17052004Os

# ---------- JPA / Hibernate ----------
# "none": Hibernate NO crea ni modifica tablas; se usan las que ya existen en MySQL
spring.jpa.hibernate.ddl-auto=none
# Usa los nombres de columnas EXACTOS que pusimos en las anotaciones (ej: BARBERO_idUSUARIO)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Muestra en consola el SQL que genera Hibernate (útil para aprender)
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- Thymeleaf ----------
# Sin caché para ver los cambios en el HTML sin reiniciar
spring.thymeleaf.cache=false

# ---------- Sesión ----------
server.servlet.session.timeout=30m

# Mensajes en español y UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.web.locale=es_CO
